<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频管理 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .video-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .video-card { background:white; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
        .video-card video { width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; display:block; }
        .video-content { padding:16px; }
        .video-title { font-weight:600; margin-bottom:4px; color:var(--secondary); }
        .video-desc { color:var(--text-light); font-size:13px; margin-bottom:12px; }
    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            视频管理
        </h1>
        <div><a href="/admin">返回后台</a></div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="/admin">总览</a></li>
                <li><a href="/admin/sliders">轮播图</a></li>
                <li><a href="/admin/products">产品管理</a></li>
                <li><a href="/admin/videos" class="active">视频管理</a></li>
                <li><a href="/admin/cases">案例管理</a></li>
                <li><a href="/admin/messages">留言管理</a></li>
                <li><a href="/admin/settings">基本设置</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-card">
                <h2>上传视频</h2>
                <p style="color:var(--text-light);font-size:14px;margin-bottom:16px;">支持 MP4 格式，最大 100MB</p>
                <form id="addVideoForm" class="admin-form">
                    <div class="admin-form-group">
                        <label>视频标题 *</label>
                        <input type="text" name="title" placeholder="如：企业介绍视频" required>
                    </div>
                    <div class="admin-form-group">
                        <label>视频描述</label>
                        <textarea name="description" placeholder="视频内容简介..." rows="3"></textarea>
                    </div>
                    <div class="admin-form-group">
                        <label>视频文件 *</label>
                        <input type="file" name="video" accept="video/*" required>
                        <small>MP4 格式，不超过 100MB</small>
                    </div>
                    <button type="submit" class="btn-primary">上传视频</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>视频列表</h2>
                <div class="video-grid" id="videoList">
                    <p style="text-align:center;color:#999;grid-column:1/-1;padding:20px;">加载中...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
    const API = '/api/videos';
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login';

    function showToast(msg, type) {
        const c = document.getElementById('tc') || (()=>{const d=document.createElement('div');d.className='toast-container';d.id='tc';document.body.appendChild(d);return d;})();
        const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
    }

    async function loadVideos() {
        try {
            const res = await fetch(API);
            const videos = await res.json();
            const container = document.getElementById('videoList');

            if (!videos || videos.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;padding:20px;">暂无视频</p>';
                return;
            }

            container.innerHTML = videos.map(v => `
                <div class="video-card">
                    <video controls preload="metadata">
                        <source src="${v.video}" type="video/mp4">
                    </video>
                    <div class="video-content">
                        <div class="video-title">${v.title}</div>
                        <div class="video-desc">${v.description || ''}</div>
                        <button class="admin-btn admin-btn-delete" onclick="deleteVideo(${v.id})">删除</button>
                    </div>
                </div>
            `).join('');
        } catch(err) {
            document.getElementById('videoList').innerHTML = '<p style="text-align:center;color:#EF4444;grid-column:1/-1;">加载失败</p>';
        }
    }

    document.getElementById('addVideoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '上传中...';

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' },
                body: formData
            });
            if (res.ok) { showToast('上传成功', 'success'); e.target.reset(); loadVideos(); }
            else { showToast('上传失败', 'error'); }
        } catch(err) { showToast('网络错误', 'error'); }
        finally { btn.disabled = false; btn.textContent = '上传视频'; }
    });

    async function deleteVideo(id) {
        if (!confirm('确定删除？')) return;
        try {
            const res = await fetch(`${API}/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            if (res.ok) { showToast('删除成功', 'success'); loadVideos(); }
            else showToast('删除失败', 'error');
        } catch(err) { showToast('网络错误', 'error'); }
    }

    loadVideos();
    </script>
</body>
</html>
