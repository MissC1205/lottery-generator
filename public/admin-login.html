<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div style="text-align:center;margin-bottom:8px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#B8860B" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>管理后台</h1>
        <p>龙南彩艺装饰材料厂</p>
        <div class="login-error" id="loginError">密码错误，请重试</div>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">管理员密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autofocus>
            </div>
            <button type="submit" class="btn-primary login-btn">登 录</button>
        </form>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: e.target.password.value })
            });
            const data = await res.json();

            if (res.ok && data.token) {
                // 保存token到localStorage
                localStorage.setItem('admin_token', data.token);
                // 记录到期时间
                const exp = new Date();
                exp.setHours(23, 59, 59, 999);
                localStorage.setItem('admin_token_exp', exp.toISOString());
                // 跳转到管理后台
                window.location.href = '/admin?token=' + data.token;
            } else {
                document.getElementById('loginError').textContent = data.error || '密码错误';
                document.getElementById('loginError').classList.add('show');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        } catch (err) {
            document.getElementById('loginError').textContent = '网络错误，请检查服务器';
            document.getElementById('loginError').classList.add('show');
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    });

    // 回车提交
    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    });
    </script>
</body>
</html>
