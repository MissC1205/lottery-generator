<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品管理 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            产品管理
        </h1>
        <div>
            <a href="/admin">返回后台</a>
            <a href="/">返回网站</a>
        </div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="/admin">总览</a></li>
                <li><a href="/admin/sliders">轮播图</a></li>
                <li><a href="/admin/products" class="active">产品管理</a></li>
                <li><a href="/admin/videos">视频管理</a></li>
                <li><a href="/admin/cases">案例管理</a></li>
                <li><a href="/admin/messages">留言管理</a></li>
                <li><a href="/admin/settings">基本设置</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-card">
                <h2>添加新产品</h2>
                <form id="productForm" class="admin-form">
                    <div class="admin-form-group">
                        <label>产品名称 *</label>
                        <input type="text" name="name" placeholder="如：环保型多彩涂料" required>
                    </div>
                    <div class="admin-form-group">
                        <label>产品描述</label>
                        <div style="display:flex;gap:8px;">
                            <textarea name="description" placeholder="产品特点、用途等..." rows="3" style="flex:1;"></textarea>
                            <button type="button" class="btn-outline ai-gen-btn" onclick="aiGenerateDesc()" style="white-space:nowrap;padding:8px 12px;font-size:12px;align-self:flex-end;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                                AI 生成
                            </button>
                        </div>
                    </div>
                    <div class="admin-form-group">
                        <label>价格</label>
                        <input type="text" name="price" placeholder="如：188元/桶 或 面议">
                    </div>
                    <div class="admin-form-group">
                        <label>分类</label>
                        <input type="text" name="category" placeholder="如：涂料、瓷砖、地板">
                    </div>
                    <div class="admin-form-group">
                        <label>产品图片</label>
                        <input type="file" name="image" accept="image/*">
                        <small>支持 JPG/PNG/GIF/WebP 格式</small>
                    </div>
                    <button type="submit" class="btn-primary">添加产品</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>产品列表</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>图片</th>
                            <th>名称</th>
                            <th>描述</th>
                            <th>价格</th>
                            <th>分类</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <tr><td colspan="6" style="text-align:center;color:#999;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <h3>确认删除</h3>
            <p id="confirmMsg">确定要删除这个产品吗？此操作不可恢复。</p>
            <div class="modal-actions">
                <button class="btn-outline" onclick="closeModal()" style="padding:8px 20px;font-size:13px;">取消</button>
                <button class="btn-primary" id="confirmBtn" style="padding:8px 20px;font-size:13px;background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:none;">确认删除</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api/products';
    const TOKEN = localStorage.getItem('admin_token');
    let pendingDeleteId = null;

    function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer') || (() => {
            const d = document.createElement('div');
            d.className = 'toast-container';
            d.id = 'toastContainer';
            document.body.appendChild(d);
            return d;
        })();
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function openModal(msg, onConfirm) {
        document.getElementById('confirmMsg').textContent = msg;
        document.getElementById('confirmModal').classList.add('show');
        document.getElementById('confirmBtn').onclick = () => { closeModal(); onConfirm(); };
    }

    function closeModal() {
        document.getElementById('confirmModal').classList.remove('show');
    }

    async function loadProducts() {
        const res = await fetch(API);
        const products = await res.json();
        const tbody = document.getElementById('productList');

        if (!products || products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">暂无产品，请添加</td></tr>';
            return;
        }

        tbody.innerHTML = products.map(p => `
            <tr>
                <td>${p.image ? `<img src="${p.image}" class="product-thumb">` : '<div class="no-image">无图</div>'}</td>
                <td><strong>${p.name}</strong></td>
                <td style="color:var(--text-light);font-size:13px;">${p.description || '-'}</td>
                <td style="color:#EF4444;font-weight:600;">${p.price || '-'}</td>
                <td><span style="background:rgba(184,134,11,0.1);color:var(--primary);padding:2px 10px;border-radius:4px;font-size:12px;">${p.category || '-'}</span></td>
                <td><button class="admin-btn admin-btn-delete" onclick="confirmDelete(${p.id})">删除</button></td>
            </tr>
        `).join('');
    }

    function confirmDelete(id) {
        pendingDeleteId = id;
        openModal('确定要删除这个产品吗？此操作不可恢复。', () => deleteProduct(pendingDeleteId));
    }

    async function deleteProduct(id) {
        try {
            const res = await fetch(`${API}/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            if (res.ok) {
                showToast('删除成功', 'success');
                loadProducts();
            } else {
                const data = await res.json();
                if (data.needLogin) { window.location.href = '/admin/login'; return; }
                showToast('删除失败', 'error');
            }
        } catch (err) {
            showToast('网络错误', 'error');
        }
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = '添加中...';

        try {
            formData.append('x-admin-token', TOKEN);
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' },
                body: formData
            });

            if (res.ok) {
                showToast('添加成功！', 'success');
                form.reset();
                loadProducts();
            } else {
                const data = await res.json();
                if (data.needLogin) { window.location.href = '/admin/login'; return; }
                showToast('添加失败', 'error');
            }
        } catch (err) {
            showToast('网络错误', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '添加产品';
        }
    });

    loadProducts();

    async function aiGenerateDesc() {
        const name = document.querySelector('input[name="name"]').value.trim();
        const category = document.querySelector('input[name="category"]').value.trim();
        if (!name) {
            showToast('请先填写产品名称', 'error');
            document.querySelector('input[name="name"]').focus();
            return;
        }

        const btn = document.querySelector('.ai-gen-btn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ 生成中...';

        try {
            const res = await fetch('/api/ai/generate-description', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN },
                body: JSON.stringify({ name, category })
            });
            const data = await res.json();
            if (data.description) {
                document.querySelector('textarea[name="description"]').value = data.description;
                showToast('AI 描述已生成！', 'success');
            } else {
                showToast('生成失败', 'error');
            }
        } catch {
            showToast('网络错误', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    </script>
</body>
</html>
