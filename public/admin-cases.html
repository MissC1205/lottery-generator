<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例管理 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .case-grid-admin { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
        .case-card-admin { background:white; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); transition:var(--transition); }
        .case-card-admin:hover { box-shadow:var(--shadow-hover); }
        .case-thumb { width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--bg-light); }
        .case-thumb-placeholder { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#e8e0d0,#f0e8d8); font-size:40px; color:var(--text-lighter); }
        .case-card-content { padding:16px; }
        .case-card-title { font-weight:600; margin-bottom:4px; }
        .case-card-desc { color:var(--text-light); font-size:13px; margin-bottom:10px; }
    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            案例管理
        </h1>
        <div><a href="/admin">返回后台</a></div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="/admin">总览</a></li>
                <li><a href="/admin/sliders">轮播图</a></li>
                <li><a href="/admin/products">产品管理</a></li>
                <li><a href="/admin/videos">视频管理</a></li>
                <li><a href="/admin/cases" class="active">案例管理</a></li>
                <li><a href="/admin/messages">留言管理</a></li>
                <li><a href="/admin/settings">基本设置</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-card">
                <h2>添加工案例</h2>
                <form id="addCaseForm" class="admin-form">
                    <div class="admin-form-group">
                        <label>案例标题 *</label>
                        <input type="text" name="title" placeholder="如：某商业综合体项目" required>
                    </div>
                    <div class="admin-form-group">
                        <label>案例描述</label>
                        <textarea name="description" placeholder="描述这个项目的特点..." rows="3"></textarea>
                    </div>
                    <div class="admin-form-group">
                        <label>分类</label>
                        <input type="text" name="category" placeholder="如：商业地产、酒店会所" value="工程案例">
                    </div>
                    <div class="admin-form-group">
                        <label>案例图片</label>
                        <input type="file" name="image" accept="image/*">
                    </div>
                    <button type="submit" class="btn-primary">添加案例</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>案例列表</h2>
                <div class="case-grid-admin" id="caseList">
                    <p style="text-align:center;color:#999;grid-column:1/-1;padding:20px;">加载中...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
    const API = '/api/cases';
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login';

    function showToast(msg, type) {
        const c = document.getElementById('tc') || (()=>{const d=document.createElement('div');d.className='toast-container';d.id='tc';document.body.appendChild(d);return d;})();
        const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
    }

    async function loadCases() {
        try {
            const res = await fetch(API);
            const cases = await res.json();
            const container = document.getElementById('caseList');
            if (!cases || cases.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;padding:20px;">暂无案例</p>';
                return;
            }
            container.innerHTML = cases.map(c => `
                <div class="case-card-admin">
                    ${c.image ? `<img src="${c.image}" class="case-thumb">` : '<div class="case-thumb-placeholder">🏗️</div>'}
                    <div class="case-card-content">
                        <div class="case-card-title">${c.title}</div>
                        <div class="case-card-desc">${c.description || ''}</div>
                        <button class="admin-btn admin-btn-delete" onclick="deleteCase(${c.id})">删除</button>
                    </div>
                </div>
            `).join('');
        } catch(err) {
            document.getElementById('caseList').innerHTML = '<p style="text-align:center;color:#EF4444;grid-column:1/-1;">加载失败</p>';
        }
    }

    document.getElementById('addCaseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '添加中...';

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' },
                body: formData
            });
            if (res.ok) { showToast('添加成功', 'success'); e.target.reset(); loadCases(); }
            else { showToast('添加失败', 'error'); }
        } catch(err) { showToast('网络错误', 'error'); }
        finally { btn.disabled = false; btn.textContent = '添加案例'; }
    });

    async function deleteCase(id) {
        if (!confirm('确定删除？')) return;
        try {
            const res = await fetch(`${API}/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            if (res.ok) { showToast('删除成功', 'success'); loadCases(); }
            else showToast('删除失败', 'error');
        } catch(err) { showToast('网络错误', 'error'); }
    }

    loadCases();
    </script>
</body>
</html>
