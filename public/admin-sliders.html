<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮播图管理 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .slider-preview { width:200px; height:100px; object-fit:cover; border-radius:8px; background:var(--bg-light); }
        .slider-item { display:flex; align-items:center; gap:20px; padding:16px; border-bottom:1px solid #f0f0f0; }
        .slider-item:last-child { border-bottom:none; }
        .slider-info { flex:1; }
        .slider-actions { display:flex; gap:10px; align-items:center; }
        .add-slider-form { background:var(--bg-light); padding:24px; border-radius:8px; margin-bottom:24px; }
    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            轮播图管理
        </h1>
        <div><a href="/admin">返回后台</a></div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="/admin">总览</a></li>
                <li><a href="/admin/sliders" class="active">轮播图</a></li>
                <li><a href="/admin/products">产品管理</a></li>
                <li><a href="/admin/videos">视频管理</a></li>
                <li><a href="/admin/cases">案例管理</a></li>
                <li><a href="/admin/messages">留言管理</a></li>
                <li><a href="/admin/settings">基本设置</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-card">
                <h2>添加轮播图</h2>
                <form id="addSliderForm" class="add-slider-form">
                    <div class="admin-form-group">
                        <label>标题 *</label>
                        <input type="text" name="title" placeholder="如：品质保障 诚信经营" required>
                    </div>
                    <div class="admin-form-group">
                        <label>副标题</label>
                        <input type="text" name="subtitle" placeholder="如：多年行业经验 值得信赖">
                    </div>
                    <div class="admin-form-group">
                        <label>链接</label>
                        <input type="text" name="link" value="#products" placeholder="#products 或 #about">
                        <small>点击轮播图跳转的页面区域</small>
                    </div>
                    <div class="admin-form-group">
                        <label>背景图片</label>
                        <input type="file" name="image" accept="image/*">
                        <small>建议尺寸 1920×600 像素</small>
                    </div>
                    <button type="submit" class="btn-primary">添加轮播图</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>轮播图列表</h2>
                <div id="sliderList"><p style="text-align:center;color:#999;padding:20px;">加载中...</p></div>
            </div>
        </main>
    </div>

    <script>
    const API = '/api/sliders';
    const TOKEN = localStorage.getItem('admin_token');
    if (!TOKEN) window.location.href = '/admin/login';

    function showToast(msg, type) {
        const c = document.getElementById('tc') || (() => { const d = document.createElement('div'); d.className='toast-container'; d.id='tc'; document.body.appendChild(d); return d; })();
        const t = document.createElement('div'); t.className='toast '+type; t.textContent=msg; c.appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
    }

    async function loadSliders() {
        const res = await fetch(API);
        const sliders = await res.json();
        const container = document.getElementById('sliderList');
        if (!sliders || sliders.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">暂无轮播图</p>';
            return;
        }
        container.innerHTML = sliders.map(s => `
            <div class="slider-item">
                <img src="${s.image || ''}" class="slider-preview"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 100%22><rect fill=%22%23eee%22 width=%22200%22 height=%22100%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2214%22>无图片</text></svg>'">
                <div class="slider-info">
                    <h3 style="margin-bottom:4px;">${s.title}</h3>
                    <p style="color:var(--text-light);font-size:13px;">${s.subtitle || ''}</p>
                    <p style="color:var(--text-lighter);font-size:12px;">链接：${s.link}</p>
                </div>
                <div class="slider-actions">
                    ${s.active ? '<span style="color:#10B981;font-size:13px;">● 启用中</span>' : ''}
                    <button class="admin-btn admin-btn-delete" onclick="deleteSlider(${s.id})">删除</button>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('addSliderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '添加中...';

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' },
                body: formData
            });
            if (res.ok) { showToast('添加成功', 'success'); e.target.reset(); loadSliders(); }
            else { const d = await res.json(); if (d.needLogin) { window.location.href='/admin/login'; return; } showToast('添加失败', 'error'); }
        } catch(err) { showToast('网络错误', 'error'); }
        finally { btn.disabled = false; btn.textContent = '添加轮播图'; }
    });

    async function deleteSlider(id) {
        if (!confirm('确定删除？')) return;
        try {
            const res = await fetch(`${API}/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            if (res.ok) { showToast('删除成功', 'success'); loadSliders(); }
            else showToast('删除失败', 'error');
        } catch(err) { showToast('网络错误', 'error'); }
    }

    loadSliders();
    </script>
</body>
</html>
