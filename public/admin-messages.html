<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 - 龙南彩艺</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            留言管理
        </h1>
        <div>
            <a href="/admin">返回后台</a>
            <a href="/">返回网站</a>
        </div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="/admin">总览</a></li>
                <li><a href="/admin/sliders">轮播图</a></li>
                <li><a href="/admin/products">产品管理</a></li>
                <li><a href="/admin/videos">视频管理</a></li>
                <li><a href="/admin/cases">案例管理</a></li>
                <li><a href="/admin/messages" class="active">留言管理</a></li>
                <li><a href="/admin/settings">基本设置</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-card">
                <h2>留言列表</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>留言内容</th>
                            <th>时间</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="messageList">
                        <tr><td colspan="6" style="text-align:center;color:#999;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <h3>确认删除</h3>
            <p id="confirmMsg">确定要删除这条留言吗？</p>
            <div class="modal-actions">
                <button class="btn-outline" onclick="closeModal()" style="padding:8px 20px;font-size:13px;">取消</button>
                <button class="btn-primary" id="confirmBtn" style="padding:8px 20px;font-size:13px;background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:none;">确认删除</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api/messages';
    const TOKEN = localStorage.getItem('admin_token');
    let pendingDeleteId = null;

    if (!TOKEN) { window.location.href = '/admin/login'; }

    function showToast(msg, type) {
        const c = document.getElementById('tc') || (() => { const d = document.createElement('div'); d.className = 'toast-container'; d.id = 'tc'; document.body.appendChild(d); return d; })();
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        c.appendChild(t);
        requestAnimationFrame(() => t.classList.add('show'));
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function openModal(msg, onConfirm) {
        document.getElementById('confirmMsg').textContent = msg;
        document.getElementById('confirmModal').classList.add('show');
        document.getElementById('confirmBtn').onclick = () => { closeModal(); onConfirm(); };
    }

    function closeModal() { document.getElementById('confirmModal').classList.remove('show'); }

    async function loadMessages() {
        try {
            const res = await fetch(API, { headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' } });
            if (res.status === 401) { window.location.href = '/admin/login'; return; }
            const messages = await res.json();
            const tbody = document.getElementById('messageList');

            if (!messages || messages.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">暂无留言</td></tr>';
                return;
            }

            messages.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            tbody.innerHTML = messages.map(m => `
                <tr style="background: ${m.read ? 'transparent' : 'rgba(184,134,11,0.04)'};">
                    <td><strong>${m.name}</strong></td>
                    <td><a href="tel:${m.phone}" style="color:var(--primary);">${m.phone}</a></td>
                    <td style="color:var(--text-light);max-width:300px;white-space:normal;">${m.message}</td>
                    <td style="color:var(--text-lighter);font-size:13px;">${new Date(m.createdAt).toLocaleString('zh-CN')}</td>
                    <td>
                        <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;${m.read ? 'background:#f0f0f0;color:#999;' : 'background:rgba(16,185,129,0.1);color:#10B981;'}">
                            <span style="width:6px;height:6px;border-radius:50%;${m.read ? 'background:#ccc;' : 'background:#10B981;'}"></span>
                            ${m.read ? '已读' : '未读'}
                        </span>
                    </td>
                    <td>
                        ${!m.read ? `<button class="admin-btn admin-btn-edit" onclick="markRead(${m.id})" style="margin-right:5px;">标为已读</button>` : ''}
                        <button class="admin-btn admin-btn-delete" onclick="confirmDelete(${m.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            document.getElementById('messageList').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#EF4444;">加载失败</td></tr>';
        }
    }

    async function markRead(id) {
        try {
            await fetch(`${API}/${id}/read`, {
                method: 'PUT',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            loadMessages();
        } catch (err) { showToast('操作失败', 'error'); }
    }

    function confirmDelete(id) {
        pendingDeleteId = id;
        openModal('确定要删除这条留言吗？此操作不可恢复。', () => deleteMessage(pendingDeleteId));
    }

    async function deleteMessage(id) {
        try {
            const res = await fetch(`${API}/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': TOKEN, 'x-requested-with': 'admin' }
            });
            if (res.ok) { showToast('删除成功', 'success'); loadMessages(); }
            else { showToast('删除失败', 'error'); }
        } catch (err) { showToast('网络错误', 'error'); }
    }

    loadMessages();
    </script>
</body>
</html>
